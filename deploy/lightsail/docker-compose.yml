services:
  migrate:
    image: ${APP_IMAGE:-lightsail-app:latest}
    pull_policy: never
    env_file:
      - ${AUDITLIFT_APP_ENV_FILE:-/etc/auditlift/app.env}
    command:
      [
        'sh',
        '-c',
        'node /app/baseline-migrations.mjs && ./node_modules/.bin/drizzle-kit migrate --config=drizzle.config.ts'
      ]
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  app:
    image: ${APP_IMAGE:-lightsail-app:latest}
    pull_policy: never
    restart: unless-stopped
    env_file:
      - ${AUDITLIFT_APP_ENV_FILE:-/etc/auditlift/app.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"'
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  questionnaire-scheduler:
    image: ${APP_IMAGE:-lightsail-app:latest}
    pull_policy: never
    restart: unless-stopped
    env_file:
      - ${AUDITLIFT_APP_ENV_FILE:-/etc/auditlift/app.env}
    command: ['node', '/app/questionnaire-scheduler.mjs']
    volumes:
      - ./questionnaire-scheduler.mjs:/app/questionnaire-scheduler.mjs:ro
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ${AUDITLIFT_DB_ENV_FILE:-/etc/auditlift/db.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
