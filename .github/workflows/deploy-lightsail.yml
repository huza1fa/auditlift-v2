name: Deploy Lightsail

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing ECR image tag to deploy (leave empty to build this commit)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: 676799697185.dkr.ecr.us-east-1.amazonaws.com/auditlift
  IMAGE_TAG: ${{ inputs.image_tag || format('sha-{0}', github.sha) }}
  LIGHTSAIL_USER: ubuntu

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          AUDITLIFT_APP_ENV_FILE=/dev/null AUDITLIFT_DB_ENV_FILE=/dev/null APP_IMAGE=lightsail-app:validation docker compose -f deploy/lightsail/docker-compose.yml config -q
          docker run --rm -v "$PWD/deploy/lightsail/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          node --check deploy/lightsail/questionnaire-scheduler.mjs

      - name: Validate image tag
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo 'image_tag must be a valid ECR tag (1-128 characters: letters, digits, _, ., -).' >&2
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::676799697185:role/auditlift-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and publish image
        if: ${{ !inputs.image_tag }}
        run: |
          docker build --platform linux/amd64 -t "$ECR_REPOSITORY:$IMAGE_TAG" -t "$ECR_REPOSITORY:main" .
          docker push "$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REPOSITORY:main"

      - name: Pull rollback image
        if: ${{ inputs.image_tag }}
        run: docker pull "$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Configure Lightsail SSH access
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          LIGHTSAIL_SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s' "$LIGHTSAIL_SSH_PRIVATE_KEY" > ~/.ssh/lightsail
          chmod 600 ~/.ssh/lightsail
          test -n "$LIGHTSAIL_SSH_KNOWN_HOSTS"
          printf '%s\n' "$LIGHTSAIL_SSH_KNOWN_HOSTS" > ~/.ssh/lightsail_known_hosts
          chmod 600 ~/.ssh/lightsail_known_hosts

      - name: Transfer and deploy image
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          ssh_options=(-i ~/.ssh/lightsail -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/lightsail_known_hosts")
          target="$LIGHTSAIL_USER@$LIGHTSAIL_HOST"

          docker save "$ECR_REPOSITORY:$IMAGE_TAG" | gzip | ssh "${ssh_options[@]}" "$target" 'gzip -d | sudo docker load'
          scp "${ssh_options[@]}" deploy/lightsail/docker-compose.yml "$target:/tmp/auditlift-compose.yml"
          scp "${ssh_options[@]}" deploy/lightsail/Caddyfile "$target:/tmp/auditlift-Caddyfile"
          scp "${ssh_options[@]}" deploy/lightsail/questionnaire-scheduler.mjs "$target:/tmp/auditlift-questionnaire-scheduler.mjs"

          # Write the validated image reference as data, never into a remote shell command.
          printf '%s\n' "$ECR_REPOSITORY:$IMAGE_TAG" | ssh "${ssh_options[@]}" "$target" 'sudo install -d -m 755 /opt/auditlift && sudo tee /opt/auditlift/app-image > /dev/null && sudo chmod 600 /opt/auditlift/app-image'

          ssh "${ssh_options[@]}" "$target" 'sudo sh -s' <<'REMOTE'
          set -eu
          install -d -m 755 /opt/auditlift/deploy/lightsail
          install -m 644 /tmp/auditlift-compose.yml /opt/auditlift/deploy/lightsail/docker-compose.yml
          install -m 644 /tmp/auditlift-Caddyfile /opt/auditlift/deploy/lightsail/Caddyfile
          install -m 644 /tmp/auditlift-questionnaire-scheduler.mjs /opt/auditlift/deploy/lightsail/questionnaire-scheduler.mjs
          APP_IMAGE=$(cat /opt/auditlift/app-image)
          export APP_IMAGE
          if ! docker compose -f /opt/auditlift/deploy/lightsail/docker-compose.yml up -d --no-build --force-recreate --wait; then
            docker compose -f /opt/auditlift/deploy/lightsail/docker-compose.yml logs --no-color db migrate app
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1/ > /dev/null
          REMOTE
